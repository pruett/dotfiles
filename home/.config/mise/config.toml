[tools]
node = "lts"
# Global npm CLIs live here, not in packages/bundle: mise's node is the one
# on PATH, so npm -g or brew bundle would install into a node you don't run.
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:agent-browser" = "latest"
"npm:portless" = "latest"
"npm:vercel" = "latest"
ruby = "3.4"

[settings]
# Keep the shims dir off PATH. With this on, `mise activate` prepends
# ~/.local/share/mise/shims so missing tools can auto-install, which makes
# every node/npx call go through mise even in dirs with no mise config.
not_found_auto_install = false

# Cloudflare Tunnel record for this machine. Sourced by ~/.local/bin/cloudflared-tunnel.
#
# The tunnel is *remotely managed*: ingress rules are edited in the Cloudflare
# dashboard (Zero Trust > Networks > Tunnels), pushed to the connector at runtime,
# and never read from a local config.yml. INGRESS below is the expected state,
# used by `cloudflared-tunnel status` to probe each hostname and flag drift.

TUNNEL_NAME="kevin-dev"
TUNNEL_ID="1c5b7b08-762d-4e0b-aa5d-87fcf0e2d95a"

# "public-hostname=origin-service" — mirror the dashboard's Public Hostname tab.
# https origins are verified against the System keychain, so mkcert -install
# is enough; no noTLSVerify needed.
INGRESS=(
  "kevin-dev.supp.co=https://localhost:3001"   # SvelteKit web (pnpm dev)
)

# Where `cloudflared service install` puts things on macOS (daemon runs as root).
LAUNCHD_LABEL="com.cloudflare.cloudflared"
LAUNCHD_PLIST="/Library/LaunchDaemons/${LAUNCHD_LABEL}.plist"
SYSTEM_TOKEN="/Library/Application Support/${LAUNCHD_LABEL}/token"
LOG_OUT="/Library/Logs/${LAUNCHD_LABEL}.out.log"
LOG_ERR="/Library/Logs/${LAUNCHD_LABEL}.err.log"

onboarding = false

[keys]
prefix = "ctrl+a"
goto = "prefix+f"
split_vertical = "prefix+backslash"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
resize_pane_left = "ctrl+shift+h"
resize_pane_down = "ctrl+shift+j"
resize_pane_up = "ctrl+shift+k"
resize_pane_right = "ctrl+shift+l"
# Navigate mode (opened by prefix+w): j/k move through the workspace list,
# up/down arrows move between panes (left/right arrows always move between panes).
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[ui]
show_agent_labels_on_pane_borders = true
# Ask for a workspace name before interactive creation instead of auto-naming.
prompt_new_workspace_name = true

status_indicators = "symbols"

# Background notification popup delivery.
# "terminal" hands the notification to Ghostty (OSC 777), so it carries the
# Ghostty icon and clicking it focuses Ghostty. "system" fell back to
# osascript, which attributed notifications to Script Editor and opened it on click.
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[theme]
name = "nord"
auto_switch = false

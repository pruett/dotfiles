onboarding = false

[keys]
prefix = "ctrl+a"
goto = "prefix+f"
split_vertical = "prefix+backslash"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
resize_pane_left = "ctrl+shift+h"
resize_pane_down = "ctrl+shift+j"
resize_pane_up = "ctrl+shift+k"
resize_pane_right = "ctrl+shift+l"
# Navigate mode (opened by prefix+w): j/k move through the workspace list,
# up/down arrows move between panes (left/right arrows always move between panes).
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "off"

[theme]
name = "nord"
auto_switch = false
